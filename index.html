<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ignite Records</title>
  <meta name="description" content="Ignite Records, independent original music. Sean Levine, Marli West, Teomic Fire, Nixie Row." />
  <meta name="theme-color" content="#0D0D0D" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css?v=20260918he" />
  <style>
    .stories-wrap { padding: 10px 0 8px !important; background: #151515; border-bottom: 1px solid rgba(245,166,35,0.16); }
    .stories { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; justify-content: center; gap: 12px; overflow-x: auto; overflow-y: hidden; padding: 4px 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .stories::-webkit-scrollbar { display: none; }
    .story { flex: 0 0 72px !important; width: 72px !important; max-width: 72px !important; text-align: center; color: #F0EDE8; text-decoration: none; }
    .story-ring { display: block; width: 64px; height: 64px; margin: 0 auto 4px; padding: 2px; border-radius: 50%; background: linear-gradient(135deg, #F5A623, #ffd27a 45%, #E07B00); }
    .story-ring img { width: 60px !important; height: 60px !important; max-width: 60px !important; object-fit: cover; border-radius: 50%; border: 2px solid #151515; display: block; }
    .story-label { display: block; font-size: 10px; line-height: 1.2; color: #A8A89E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (min-width: 769px) {
      .playlist-cards { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; max-width: 720px; margin-left: auto; margin-right: auto; gap: 0.9rem; }
      .playlist-card-title { font-size: 1.2rem; }
      .playlist-card-body { padding: 0.8rem 0.9rem 1rem; }
      .playlist-card-body p { font-size: 0.8rem; }
    }
    @media (max-width: 768px) {
      .stories { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img wide" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="#artists" data-i18n="artists">Artists</a>
        <a href="#releases" data-i18n="music">Music</a>
        <a href="#playlists" data-i18n="playlists">Playlists</a>
        <a href="#contact" data-i18n="contact">Contact</a>
      </div>
    </div>
  </nav>
  <div class="stories-wrap" aria-label="Playlists and albums">
    <div class="stories" id="storiesBar"></div>
  </div>
  <header class="hero">
    <img class="logo-img" src="brand/logo-hero.jpg" alt="Ignite Records, Independent · Original" />
    <p class="tag" data-i18n="tag">Music Label</p>
  </header>
  <section id="artists" class="bg2">
    <p class="section-label" data-i18n="roster">Our Roster</p>
    <h2 class="section-title" data-i18n="theArtists">The Artists</h2>
    <div class="artists-grid" id="artistsGrid"></div>
  </section>
  <section id="releases">
    <p class="section-label" data-i18n="latest">Latest Releases</p>
    <h2 class="section-title" data-i18n="theMusic">The Music</h2>
    <div class="container" id="releasesList"></div>
  </section>
  <section id="playlists" class="bg2">
    <p class="section-label" data-i18n="listen">Listen</p>
    <h2 class="section-title" data-i18n="playlists">Playlists</h2>
    <div class="container playlist-cards" id="playlistCards"></div>
  </section>
  <section id="contact">
    <div class="container-sm">
      <h2 class="section-title" data-i18n="getInTouch">Get in Touch</h2>
      <form id="contactForm">
        <div class="form-group"><label for="name" data-i18n="name">Name *</label><input id="name" name="name" required /></div>
        <div class="form-group"><label for="email" data-i18n="email">Email *</label><input id="email" name="email" type="email" required /></div>
        <div class="form-group"><label for="message" data-i18n="message">Message *</label><textarea id="message" name="message" required></textarea></div>
        <button type="submit" class="btn" style="width:100%" data-i18n="send">Send Message</button>
        <p class="msg" id="contactMsg" hidden></p>
      </form>
    </div>
  </section>
  <footer><p><span data-i18n="footer">© 2026 Ignite Records. All rights reserved.</span> · <a href="index.html" data-i18n="home">Home</a></p></footer>
  <script src="js/catalog.js?v=20260918sean"></script>
  <script src="js/i18n.js?v=20260918hadar"></script>
  <script src="js/nav.js?v=20260918hadar"></script>
  <script>
    (function () {
      var C = window.IGNITE;
      var I = window.I18N;
      var COVERS = {
        "5KhQQ68HQwAva4oaizWKQ5": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02d209f19f51a7f5dc3911daac",
        "1VKxMF9LDjn9fFZ6SXQ1EQ": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e023de556b222e54b896d598aa8",
        "5cJ9rVCakOabCrVg4gzw1K": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02b0aacb4ed5ce7107ce738d4c",
        "5xkKPkkgkDH2NACvH8pZC2": "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e02c5ba3404e45642b8809cba50",
        "0ViDyHnGKRm2wimwVPXUIG": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02a4d722ff1a1238266f172271",
        "5BOfdDEGNX6Rshq3R4AIAE": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e023bff80c2e3bfc60b20c4383d",
        "4RikPOmKaec4BVtPx7fGhi": "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e021c34d060e4a3a1c013f7e668",
        "1YlgXuafFIqVQetPn1OKTE": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02406f9dbb7a7ee6546af68562",
        "7ab3TznxMITknzwGGI2rGA": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02361663edc3fa3ab46d805b36"
      };
      var ALBUM_IDS = {
        "5KhQQ68HQwAva4oaizWKQ5": 1,
        "1VKxMF9LDjn9fFZ6SXQ1EQ": 1,
        "5cJ9rVCakOabCrVg4gzw1K": 1,
        "5xkKPkkgkDH2NACvH8pZC2": 1,
        "0ViDyHnGKRm2wimwVPXUIG": 1,
        "5BOfdDEGNX6Rshq3R4AIAE": 1,
        "4RikPOmKaec4BVtPx7fGhi": 1,
        "1YlgXuafFIqVQetPn1OKTE": 1,
        "7ab3TznxMITknzwGGI2rGA": 1
      };
      function addStory(parent, href, img, label, extraClass, external) {
        var a = document.createElement("a");
        a.className = "story" + (extraClass ? " " + extraClass : "");
        a.href = href;
        if (external) { a.target = "_blank"; a.rel = "noopener"; }
        var short = label.length > 12 ? label.slice(0, 11) + "\u2026" : label;
        a.innerHTML = '<span class="story-ring"><img src="' + img + '" alt="' + label + '" width="60" height="60" /></span><span class="story-label">' + short + '</span>';
        parent.appendChild(a);
      }
      var playlists = I.visiblePlaylists();
      var stories = document.getElementById("storiesBar");
      playlists.forEach(function (p) {
        addStory(stories, p.submit, p.cover, I.textOf(p, "title"), "story-pl", false);
      });
      var seen = {};
      I.visibleArtists().forEach(function (artist) {
        (artist.albums || []).forEach(function (alb) {
          if (!ALBUM_IDS[alb.id] || seen[alb.id]) return;
          seen[alb.id] = 1;
          addStory(stories, "https://open.spotify.com/album/" + alb.id, COVERS[alb.id] || artist.photo, alb.title, "story-alb", true);
        });
      });
      var grid = document.getElementById("artistsGrid");
      I.visibleArtists().forEach(function (a) {
        var el = document.createElement("a");
        el.className = "artist-card";
        el.href = "artist.html?slug=" + encodeURIComponent(a.slug);
        el.innerHTML = '<img src="' + a.photo + '" alt="' + I.textOf(a, "name") + '" /><div class="artist-info"><div class="artist-name">' + I.textOf(a, "name") + '</div><div class="artist-genre">' + I.textOf(a, "genre") + '</div></div>';
        grid.appendChild(el);
      });
      var releases = document.getElementById("releasesList");
      I.visibleArtists().forEach(function (a) {
        var album = (a.albums || [])[0];
        if (!album) return;
        var row = document.createElement("div");
        row.className = "album-row";
        row.innerHTML =
          '<div><h3>' + I.textOf(a, "name") + '<br>' + album.title + '</h3><p>' + I.t("streamLine") + '</p></div>' +
          '<div>' +
          '<iframe class="spotify" title="' + I.textOf(a, "name") + '" src="https://open.spotify.com/embed/album/' + album.id + '?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>' +
          '<div class="btn-row">' +
          '<a class="btn" href="https://open.spotify.com/album/' + album.id + '" target="_blank" rel="noopener">' + I.t("listenSpotify") + '</a>' +
          (a.youtube ? '<a class="btn outline" href="' + a.youtube + '" target="_blank" rel="noopener">YouTube</a>' : '') +
          '<a class="btn outline" href="artist.html?slug=' + encodeURIComponent(a.slug) + '">' + I.t("allAlbums") + '</a>' +
          '</div></div>';
        releases.appendChild(row);
      });
      var playRoot = document.getElementById("playlistCards");
      playlists.forEach(function (p) {
        var card = document.createElement("a");
        card.className = "playlist-card";
        card.href = p.submit;
        card.innerHTML = '<img src="' + p.cover + '" alt="' + I.textOf(p, "title") + '" /><div class="playlist-card-body"><div class="playlist-card-label">' + I.textOf(p, "label") + '</div><div class="playlist-card-title">' + I.textOf(p, "title") + '</div><p>' + I.textOf(p, "desc") + '</p><span class="playlist-card-link">' + I.t("openPage") + '</span></div>';
        playRoot.appendChild(card);
      });
      document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var message = document.getElementById("message").value.trim();
        var msg = document.getElementById("contactMsg");
        var body = (I.lang() === "he" ? "\u05e9\u05dd: " : "Name: ") + name + "\n" + (I.lang() === "he" ? "\u05d0\u05d9\u05de\u05d9\u05d9\u05dc: " : "Email: ") + email + "\n\n" + message;
        window.location.href = "mailto:ignite.records2026@gmail.com?subject=" + encodeURIComponent("Ignite Records contact - " + name) + "&body=" + encodeURIComponent(body);
        msg.hidden = false; msg.className = "msg ok"; msg.textContent = I.t("openingMail");
      });
    })();
  </script>
</body>
</html>
