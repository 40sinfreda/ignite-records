<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ignite Records</title>
  <meta name="description" content="Ignite Records — independent original music. Sean Levine, Marli West, Teomic Fire, Nixie Row." />
  <meta name="theme-color" content="#0D0D0D" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css?v=20260905g" />
  <style>
    .stories-wrap { padding: 10px 0 8px !important; background: #151515; border-bottom: 1px solid rgba(245,166,35,0.16); }
    .stories { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; gap: 12px; overflow-x: auto; overflow-y: hidden; padding: 4px 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .stories::-webkit-scrollbar { display: none; }
    .story { flex: 0 0 72px !important; width: 72px !important; max-width: 72px !important; text-align: center; color: #F0EDE8; text-decoration: none; }
    .story-ring { display: block; width: 64px; height: 64px; margin: 0 auto 4px; padding: 2px; border-radius: 50%; background: linear-gradient(135deg, #F5A623, #ffd27a 45%, #E07B00); }
    .story-ring img { width: 60px !important; height: 60px !important; max-width: 60px !important; object-fit: cover; border-radius: 50%; border: 2px solid #151515; display: block; }
    .story-label { display: block; font-size: 10px; line-height: 1.2; color: #A8A89E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img wide" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="#artists">Artists</a>
        <a href="#releases">Music</a>
        <a href="#playlists">Playlists</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>
  <div class="stories-wrap" aria-label="Playlists and albums">
    <div class="stories" id="storiesBar"></div>
  </div>
  <header class="hero">
    <img class="logo-img" src="brand/logo-hero.jpg" alt="Ignite Records — Independent · Original" />
    <p class="tag">Music Label</p>
  </header>
  <section id="artists" class="bg2">
    <p class="section-label">Our Roster</p>
    <h2 class="section-title">The Artists</h2>
    <div class="artists-grid" id="artistsGrid"></div>
  </section>
  <section id="releases">
    <p class="section-label">Latest Releases</p>
    <h2 class="section-title">The Music</h2>
    <div class="container" id="releasesList"></div>
  </section>
  <section id="playlists" class="bg2">
    <p class="section-label">Listen</p>
    <h2 class="section-title">Playlists</h2>
    <div class="container playlist-cards" id="playlistCards"></div>
  </section>
  <section id="contact">
    <div class="container-sm">
      <h2 class="section-title">Get in Touch</h2>
      <form id="contactForm">
        <div class="form-group"><label for="name">Name *</label><input id="name" name="name" required /></div>
        <div class="form-group"><label for="email">Email *</label><input id="email" name="email" type="email" required /></div>
        <div class="form-group"><label for="message">Message *</label><textarea id="message" name="message" required></textarea></div>
        <button type="submit" class="btn" style="width:100%">Send Message</button>
        <p class="msg" id="contactMsg" hidden></p>
      </form>
    </div>
  </section>
  <footer><p>© 2026 Ignite Records. All rights reserved. · <a href="index.html">Home</a></p></footer>
  <script src="js/catalog.js?v=20260905g"></script>
  <script src="js/nav.js"></script>
  <script>
    (function () {
      var C = window.IGNITE;
      var COVERS = {
        "5KhQQ68HQwAva4oaizWKQ5": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02d209f19f51a7f5dc3911daac",
        "1VKxMF9LDjn9fFZ6SXQ1EQ": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e023de556b222e54b896d598aa8",
        "5cJ9rVCakOabCrVg4gzw1K": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02b0aacb4ed5ce7107ce738d4c",
        "5xkKPkkgkDH2NACvH8pZC2": "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e02c5ba3404e45642b8809cba50",
        "4dcfl54D1IAjsdIy2jRRjd": "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e027efa2c2837c69fcf5c875378",
        "08ptJT5Vuaj1TUtzDYjZRZ": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e029ebbf6735961f20f8941d54a",
        "0ViDyHnGKRm2wimwVPXUIG": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02a4d722ff1a1238266f172271",
        "34bdVJvKviIR4W5m4eebYu": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02c913b7c6346f3eda70bacf28",
        "3g2wHfIFqKJYBbocb8X1qI": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02e380ee5d67b8f0a137c75093",
        "5elVLmHYoKcuTcJXyDooN4": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e023c789034133b86b6d2b7d514",
        "5BOfdDEGNX6Rshq3R4AIAE": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e023bff80c2e3bfc60b20c4383d",
        "4RikPOmKaec4BVtPx7fGhi": "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e021c34d060e4a3a1c013f7e668",
        "56p5fgf7pInYHskZa1NrZH": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0218ab151761fda1bc4e2cf015",
        "0HL66ixZhedcySBPZDBlnh": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02ce6e81b3d8ab74381a5e5656",
        "0bnIllADfANb792HDVaggE": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02ca1bed355f2fcf587af48386",
        "28lGXQULPlPodxN5gZfu7h": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02412e11dbc6a3e44ee4313be2",
        "46iMGzd54nC6ncU8FLAfDS": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02519d32f4d58e02f98bb2d4d9",
        "7HpT8Faxu3JktiREuwE1mw": "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e0218afbb715088b29d70a55f5b",
        "7kk9ZuaUVHN8X8V4aK3m5u": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02a14e3b36835f560dcbc6bc11",
        "1YlgXuafFIqVQetPn1OKTE": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02406f9dbb7a7ee6546af68562"
      };
      function addStory(parent, href, img, label, extraClass, external) {
        var a = document.createElement("a");
        a.className = "story" + (extraClass ? " " + extraClass : "");
        a.href = href;
        if (external) { a.target = "_blank"; a.rel = "noopener"; }
        var short = label.length > 12 ? label.slice(0, 11) + "…" : label;
        a.innerHTML = '<span class="story-ring"><img src="' + img + '" alt="' + label + '" width="60" height="60" /></span><span class="story-label">' + short + '</span>';
        parent.appendChild(a);
      }
      var stories = document.getElementById("storiesBar");
      C.playlists.forEach(function (p) {
        addStory(stories, p.submit, p.cover, p.title, "story-pl", false);
      });
      C.artists.forEach(function (artist) {
        (artist.albums || []).forEach(function (alb) {
          addStory(stories, "https://open.spotify.com/album/" + alb.id, COVERS[alb.id] || artist.photo, alb.title, "story-alb", true);
        });
      });
      var grid = document.getElementById("artistsGrid");
      C.artists.forEach(function (a) {
        var el = document.createElement("a");
        el.className = "artist-card";
        el.href = "artist.html?slug=" + encodeURIComponent(a.slug);
        el.innerHTML = '<img src="' + a.photo + '" alt="' + a.name + '" /><div class="artist-info"><div class="artist-name">' + a.name + '</div><div class="artist-genre">' + a.genre + '</div></div>';
        grid.appendChild(el);
      });
      var releases = document.getElementById("releasesList");
      C.artists.forEach(function (a) {
        var album = a.albums[0];
        if (!album) return;
        var row = document.createElement("div");
        row.className = "album-row";
        row.innerHTML =
          '<div><h3>' + a.name + '<br>' + album.title + '</h3><p>Stream the full catalog and latest release on Spotify. Open the artist page for every album.</p></div>' +
          '<div>' +
          '<iframe class="spotify" title="' + a.name + '" src="https://open.spotify.com/embed/album/' + album.id + '?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>' +
          '<div class="btn-row">' +
          '<a class="btn" href="https://open.spotify.com/album/' + album.id + '" target="_blank" rel="noopener">Listen on Spotify</a>' +
          (a.youtube ? '<a class="btn outline" href="' + a.youtube + '" target="_blank" rel="noopener">YouTube</a>' : '') +
          '<a class="btn outline" href="artist.html?slug=' + encodeURIComponent(a.slug) + '">All albums</a>' +
          '</div></div>';
        releases.appendChild(row);
      });
      var playRoot = document.getElementById("playlistCards");
      C.playlists.forEach(function (p) {
        var card = document.createElement("a");
        card.className = "playlist-card";
        card.href = p.submit;
        card.innerHTML = '<img src="' + p.cover + '" alt="' + p.title + '" /><div class="playlist-card-body"><div class="playlist-card-label">' + p.label + '</div><div class="playlist-card-title">' + p.title + '</div><p>' + p.desc + '</p><span class="playlist-card-link">Open playlist page →</span></div>';
        playRoot.appendChild(card);
      });
      document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var message = document.getElementById("message").value.trim();
        var msg = document.getElementById("contactMsg");
        var body = "Name: " + name + "\nEmail: " + email + "\n\n" + message;
        window.location.href = "mailto:ignite.records2026@gmail.com?subject=" + encodeURIComponent("Ignite Records contact — " + name) + "&body=" + encodeURIComponent(body);
        msg.hidden = false; msg.className = "msg ok"; msg.textContent = "Opening your email app…";
      });
    })();
  </script>
</body>
</html>
