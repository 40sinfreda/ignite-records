<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ignite Records</title>
  <meta name="description" content="Ignite Records — independent original music. Sean Levine, Marli West, Teomic Fire, Nixie Row." />
  <meta name="theme-color" content="#0D0D0D" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img wide" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="#artists">Artists</a>
        <a href="#releases">Music</a>
        <a href="#playlists">Playlists</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <img class="logo-img" src="brand/logo-hero.jpg" alt="Ignite Records — Independent · Original" />
    <p class="tag">Music Label</p>
  </header>

  <section id="artists" class="bg2">
    <p class="section-label">Our Roster</p>
    <h2 class="section-title">The Artists</h2>
    <div class="artists-grid" id="artistsGrid"></div>
  </section>

  <section id="releases">
    <p class="section-label">Latest Releases</p>
    <h2 class="section-title">The Music</h2>
    <div class="container" id="releasesList"></div>
  </section>

  <div id="playlists"></div>

  <section id="contact">
    <div class="container-sm">
      <h2 class="section-title">Get in Touch</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name *</label>
          <input id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn" style="width:100%">Send Message</button>
        <p class="msg" id="contactMsg" hidden></p>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2026 Ignite Records. All rights reserved. · <a href="index.html">Home</a></p>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/nav.js"></script>
  <script>
    (function () {
      var C = window.IGNITE;
      var grid = document.getElementById("artistsGrid");
      C.artists.forEach(function (a) {
        var el = document.createElement("a");
        el.className = "artist-card";
        el.href = "artist.html?slug=" + encodeURIComponent(a.slug);
        el.innerHTML =
          '<img src="' + a.photo + '" alt="' + a.name + '" />' +
          '<div class="artist-info">' +
          '<div class="artist-name">' + a.name + '</div>' +
          '<div class="artist-genre">' + a.genre + '</div></div>';
        grid.appendChild(el);
      });

      var releases = document.getElementById("releasesList");
      C.artists.forEach(function (a) {
        var album = a.albums[0];
        if (!album) return;
        var row = document.createElement("div");
        row.className = "album-row";
        row.innerHTML =
          '<div>' +
          '<h3>' + a.name + '<br>' + album.title + '</h3>' +
          '<p>Stream the full catalog and latest release on Spotify. Open the artist page for every album.</p>' +
          '<div class="btn-row">' +
          '<a class="btn" href="https://open.spotify.com/album/' + album.id + '" target="_blank" rel="noopener">Listen on Spotify</a>' +
          (a.youtube ? '<a class="btn outline" href="' + a.youtube + '" target="_blank" rel="noopener">YouTube</a>' : '') +
          '<a class="btn outline" href="artist.html?slug=' + encodeURIComponent(a.slug) + '">All albums</a>' +
          '</div></div>' +
          '<div><iframe class="spotify" title="' + a.name + ' — ' + album.title + '" ' +
          'src="https://open.spotify.com/embed/album/' + album.id + '?utm_source=generator&theme=0" ' +
          'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>';
        releases.appendChild(row);
      });

      var playRoot = document.getElementById("playlists");
      C.playlists.forEach(function (p, i) {
        var sec = document.createElement("section");
        sec.id = p.id;
        if (i % 2 === 0) sec.className = "bg2";
        sec.innerHTML =
          '<div class="container playlist-grid">' +
          '<div>' +
          '<img class="playlist-cover" src="' + p.cover + '" alt="' + p.title + '" />' +
          '<p class="section-label" style="text-align:left">' + p.label + '</p>' +
          '<h2>' + p.title + '</h2>' +
          '<p style="color:var(--muted);margin-bottom:1.25rem;line-height:1.8">' + p.desc + '</p>' +
          '<div class="btn-row">' +
          '<a class="btn" href="https://open.spotify.com/playlist/' + p.spotifyId + '" target="_blank" rel="noopener">Open on Spotify</a>' +
          '<a class="btn outline" href="' + p.submit + '">Submit Your Track</a>' +
          '</div></div>' +
          '<div><iframe class="spotify" title="' + p.title + '" ' +
          'src="https://open.spotify.com/embed/playlist/' + p.spotifyId + '?utm_source=generator&theme=0" ' +
          'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>' +
          '</div>';
        playRoot.appendChild(sec);
      });

      document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var message = document.getElementById("message").value.trim();
        var msg = document.getElementById("contactMsg");
        var body = "Name: " + name + "\nEmail: " + email + "\n\n" + message;
        window.location.href =
          "mailto:ignite.records2026@gmail.com?subject=" +
          encodeURIComponent("Ignite Records contact — " + name) +
          "&body=" + encodeURIComponent(body);
        msg.hidden = false;
        msg.className = "msg ok";
        msg.textContent = "Opening your email app…";
      });
    })();
  </script>
</body>
</html>
