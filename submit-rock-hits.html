<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submit Track - IGNITE ROCK HITS</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/site.css?v=20260913t" />
</head>
<body>
<nav><div class="inner">
<a href="index.html" class="logo"><img class="logo-nav-img" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
<a href="playlist-rock-hits.html">Back</a>
</div></nav>
<main class="container-sm" style="padding:2.5rem 1.25rem 4rem">
<img src="brand/ignite-rock-hits.svg" alt="IGNITE ROCK HITS" style="width:100%;max-width:420px;border-radius:8px;margin:0 auto 1.5rem;display:block" />
<h1 class="section-title" style="text-align:left">Submit Your Track</h1>
<p style="color:var(--muted);margin-bottom:1.5rem">Spotify track link only. Manual review. Planted every 5 songs after approval.</p>
<form id="f">
<div class="form-group"><label>Full Name *</label><input id="fullname" required /></div>
<div class="form-group"><label>Artist / Stage Name *</label><input id="stagename" required /></div>
<div class="form-group"><label>Email *</label><input id="email" type="email" required /></div>
<div class="form-group"><label>Spotify Track Link *</label><input id="trackurl" type="url" required /></div>
<label class="check"><input type="checkbox" id="review" required /> Manual review, inclusion not guaranteed.</label>
<label class="check"><input type="checkbox" id="listen" required /> I will save the playlist and listen monthly.</label>
<label class="check"><input type="checkbox" id="marketing" /> Send me updates.</label>
<button type="submit" class="btn" id="btn" style="width:100%;margin-top:1.25rem">Submit Track</button>
<p class="msg" id="msg" hidden></p>
</form>
</main>
<footer><p>2026 Ignite Records</p></footer>
<script>
const SCRIPT_URL = "REPLACE_WITH_ROCK_WEBAPP_URL";
document.getElementById("f").addEventListener("submit", async function (e) {
e.preventDefault();
const msg = document.getElementById("msg");
const url = document.getElementById("trackurl").value.trim();
const m = url.match(/spotify\.com\/track\/([A-Za-z0-9]+)/);
msg.hidden = false;
if (SCRIPT_URL.indexOf("http") !== 0) { msg.className = "msg err"; msg.textContent = "Form endpoint is not connected yet."; return; }
if (!m) { msg.className = "msg err"; msg.textContent = "Enter a valid Spotify track link."; return; }
await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ form: "rock-hits", fullname: document.getElementById("fullname").value.trim(), stagename: document.getElementById("stagename").value.trim(), email: document.getElementById("email").value.trim(), trackurl: url, trackId: m[1], marketing: document.getElementById("marketing").checked }) });
msg.className = "msg ok"; msg.textContent = "Track submitted.";
document.getElementById("f").reset();
});
</script>
</body>
</html>
