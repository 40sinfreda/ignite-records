<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Trance Track — Global Trance Hits · Ignite Records</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <a href="index.html" style="font-size:0.85rem;font-weight:600">← Back</a>
    </div>
  </nav>
  <main class="container-sm" style="padding:2.5rem 1.25rem 4rem">
    <img src="brand/global-trance-hits.png" alt="Global Trance Hits" style="max-width:420px;width:100%;border-radius:8px;margin:0 auto 1.5rem;display:block" />
    <h1 class="section-title" style="text-align:left;margin-bottom:0.5rem">Submit Your Trance Track</h1>
    <p style="color:var(--muted);margin-bottom:2rem">
      Apply to feature in <strong>Global Trance Hits</strong> — Beatport Trance Top 100 mixed with selected artists, updated every Tuesday.
      Approved tracks are planted every 5 songs.
    </p>
    <form id="f">
      <div class="form-group"><label>Full Name *</label><input name="fullname" id="fullname" required /></div>
      <div class="form-group"><label>Artist / Stage Name *</label><input name="stagename" id="stagename" required /></div>
      <div class="form-group"><label>Email *</label><input name="email" id="email" type="email" required /></div>
      <div class="form-group">
        <label>Spotify Track Link *</label>
        <input name="trackurl" id="trackurl" type="url" placeholder="https://open.spotify.com/track/..." required oninput="extractTrack(this.value)" />
        <p id="trackHint" style="font-size:0.8rem;color:var(--muted);margin-top:0.4rem"></p>
      </div>
      <label class="check"><input type="checkbox" id="rights" required /> I confirm I hold the rights to this track and inclusion is not guaranteed.</label>
      <label class="check"><input type="checkbox" id="marketing" name="marketing" /> Send me updates from Ignite Records.</label>
      <button type="submit" class="btn" id="btn" style="width:100%;margin-top:1rem">Submit Track</button>
      <p class="msg" id="msg" hidden></p>
    </form>
  </main>
  <footer><p>© 2026 Ignite Records · <a href="index.html">Home</a></p></footer>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJo7u1MJdSd2vWXtCB8WVk7PY-ICkoqeFnLa8XJGlP4kh1grqTfawSN9535snpv8mK/exec";
    let trackId = "";

    function extractTrack(url) {
      const m = String(url || "").match(/spotify\.com\/track\/([A-Za-z0-9]+)/);
      trackId = m ? m[1] : "";
      const hint = document.getElementById("trackHint");
      if (!url) { hint.textContent = ""; return; }
      hint.textContent = trackId ? ("Track ID: " + trackId) : "Enter a valid Spotify track link";
      hint.style.color = trackId ? "var(--fire)" : "#ff8888";
    }

    document.getElementById("f").addEventListener("submit", async function (e) {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn");
      const fullname = document.getElementById("fullname").value.trim();
      const stagename = document.getElementById("stagename").value.trim();
      const email = document.getElementById("email").value.trim();
      const trackurl = document.getElementById("trackurl").value.trim();
      extractTrack(trackurl);

      msg.hidden = false;
      if (!fullname || !stagename || !email || !trackurl) {
        msg.className = "msg err";
        msg.textContent = "Please fill in all required fields.";
        return;
      }
      if (!trackId) {
        msg.className = "msg err";
        msg.textContent = "Enter a valid Spotify track link.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Submitting…";
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            form: "trance",
            fullname: fullname,
            stagename: stagename,
            email: email,
            trackurl: trackurl,
            trackId: trackId,
            marketing: document.getElementById("marketing").checked
          })
        });
        msg.className = "msg ok";
        msg.textContent = "Submitted! We’ll review your track for Global Trance Hits.";
        document.getElementById("f").reset();
        trackId = "";
        document.getElementById("trackHint").textContent = "";
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Something went wrong. Please try again.";
      }
      btn.disabled = false;
      btn.textContent = "Submit Track";
    });
  </script>
</body>
</html>
