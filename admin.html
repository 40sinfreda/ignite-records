<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Admin — Ignite Records</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .login-box { max-width: 420px; margin: 3rem auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 1.2rem; }
    input[type="password"] { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); padding: 0.55rem 0.7rem; border-radius: 8px; margin-top: 0.35rem; }
    .err { color: #f88; }
    .ok { color: #8f8; }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <a href="index.html" style="font-size:0.85rem">Back to site</a>
    </div>
  </nav>
  <div class="login-box" id="box">
    <h1 class="section-title" style="margin-bottom:0.4rem">Admin</h1>
    <p class="muted" style="margin-bottom:1rem">Enter password to continue.</p>
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" />
    <button class="btn" style="width:100%;margin-top:1rem" id="loginBtn">Sign in</button>
    <p class="muted err" id="loginErr" hidden></p>
  </div>
  <footer>
    <p>© 2026 Ignite Records · <a href="index.html">Home</a> · <a class="admin-link" href="admin.html">admin</a></p>
  </footer>
  <script>
    var PAGE_PASS = "181095";
    var APP = "https://script.google.com/macros/s/AKfycbxOLC1RiIQFkLhRNpxu7-1GeTJdHfdJbDPhqh4EOsRZPL16Hfrz-GKejWSPoVAhgaFD4w/exec";
    function go() {
      if (document.getElementById("loginPass").value.trim() !== PAGE_PASS) {
        document.getElementById("loginErr").hidden = false;
        document.getElementById("loginErr").textContent = "Wrong password";
        return;
      }
      document.getElementById("box").innerHTML =
        "<h1 class='section-title'>Admin</h1>" +
        "<p class='muted' style='margin:0.8rem 0'>Password accepted. Open the panel in a new tab:</p>" +
        "<a class='btn' style='display:block;text-align:center' href='" + APP + "' rel='noreferrer noopener' referrerpolicy='no-referrer' target='_blank'>Open admin panel</a>";
    }
    document.getElementById("loginBtn").onclick = go;
    document.getElementById("loginPass").addEventListener("keydown", function (e) {
      if (e.key === "Enter") go();
    });
    document.getElementById("loginPass").focus();
  </script>
</body>
</html>
