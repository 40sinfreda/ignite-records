<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Admin — Ignite Records</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    body { max-width: 880px; margin: 0 auto; }
    .admin-head { padding: 1.5rem 1.25rem 0.5rem; }
    .admin-head h1 { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.08em; font-size: 2rem; }
    .card, .track, .login-box {
      background: var(--bg2); border: 1px solid var(--line);
      border-radius: 10px; padding: 1rem 1.1rem; margin: 0.75rem 1.25rem;
    }
    .login-box { max-width: 420px; margin: 3rem auto; }
    .plist { display: flex; justify-content: space-between; align-items: center; gap: 1rem; cursor: pointer; }
    .plist:hover { border-color: var(--fire); }
    .count {
      min-width: 2.2rem; height: 2.2rem; border-radius: 999px;
      background: var(--fire); color: var(--bg); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .count.zero { background: #333; color: var(--muted); }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn.small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .ok { color: #8f8; }
    .err { color: #f88; }
    input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      color: var(--text); padding: 0.55rem 0.7rem; border-radius: 8px; margin-top: 0.35rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <a href="index.html" style="font-size:0.85rem">Back to site</a>
    </div>
  </nav>
  <div id="loginView">
    <div class="login-box">
      <h1 class="section-title" style="margin-bottom:0.4rem">Admin</h1>
      <p class="muted" style="margin-bottom:1rem">Enter password to continue.</p>
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
      <button class="btn" style="width:100%;margin-top:1rem" id="loginBtn">Sign in</button>
      <p class="muted err" id="loginErr" hidden></p>
    </div>
  </div>
  <div id="appView" class="hidden">
    <div class="admin-head">
      <h1>Admin</h1>
      <p class="muted">Pending tracks by playlist</p>
    </div>
    <p id="status" class="muted" style="padding:0 1.25rem"></p>
    <div id="list"></div>
    <div id="detail" hidden></div>
  </div>
  <footer>
    <p>© 2026 Ignite Records · <a href="index.html">Home</a></p>
  </footer>
  <script>
    var PAGE_PASS = "181095";
    var APP = "https://script.google.com/macros/s/AKfycbxOLC1RiIQFkLhRNpxu7-1GeTJdHfdJbDPhqh4EOsRZPL16Hfrz-GKejWSPoVAhgaFD4w/exec";
    var cbN = 0;
    function $(id) { return document.getElementById(id); }
    function jsonp(params) {
      return new Promise(function (resolve, reject) {
        var name = "igniteAdminCb" + (++cbN);
        var t = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 30000);
        function cleanup() {
          clearTimeout(t);
          delete window[name];
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }
        window[name] = function (data) { cleanup(); resolve(data); };
        var s = document.createElement("script");
        s.referrerPolicy = "no-referrer";
        s.onerror = function () { cleanup(); reject(new Error("blocked")); };
        s.src = APP + "?" + params + "&secret=" + encodeURIComponent(PAGE_PASS) + "&callback=" + name + "&_=" + Date.now();
        document.body.appendChild(s);
      });
    }
    function setStatus(text, cls) {
      $("status").className = "muted " + (cls || "");
      $("status").textContent = text || "";
    }
    function renderList(rows) {
      $("detail").hidden = true;
      var root = $("list");
      root.innerHTML = "";
      (rows || []).forEach(function (p) {
        var el = document.createElement("div");
        el.className = "card plist";
        el.innerHTML = "<div><strong>" + p.title + "</strong><div class='muted'>" + (p.error || p.id) + "</div></div>" +
          "<div class='count" + (p.pending ? "" : " zero") + "'>" + (p.pending || 0) + "</div>";
        el.onclick = function () { openPlaylist(p.id); };
        root.appendChild(el);
      });
    }
    function renderTracks(pack) {
      $("list").innerHTML = "";
      var box = $("detail");
      box.hidden = false;
      var html = "<div class='card'><button class='btn outline small' id='backBtn'>All playlists</button></div>";
      html += "<div class='admin-head'><h1>" + pack.title + "</h1><p class='muted'>" + (pack.tracks || []).length + " pending</p></div>";
      (pack.tracks || []).forEach(function (t) {
        html += "<div class='card track'><div><strong>" + (t.stage || "Untitled") + "</strong>" +
          "<div class='muted'>" + (t.email || "") + "</div></div>" +
          "<div class='actions'>" +
          (t.listen ? "<a class='btn outline small' target='_blank' rel='noopener' href='" + t.listen + "'>Listen</a>" : "") +
          "<button class='btn small approve' data-id='" + pack.id + "' data-row='" + t.row + "'>Approve</button>" +
          "<button class='btn outline small decline' data-id='" + pack.id + "' data-row='" + t.row + "'>Decline</button>" +
          "</div></div>";
      });
      if (!(pack.tracks || []).length) html += "<p class='muted' style='padding:1rem 1.25rem'>No pending tracks</p>";
      box.innerHTML = html;
      $("backBtn").onclick = loadList;
      box.querySelectorAll(".approve").forEach(function (btn) {
        btn.onclick = function () { decide(btn.getAttribute("data-id"), btn.getAttribute("data-row"), "approved"); };
      });
      box.querySelectorAll(".decline").forEach(function (btn) {
        btn.onclick = function () { decide(btn.getAttribute("data-id"), btn.getAttribute("data-row"), "declined"); };
      });
    }
    function failBox(err) {
      $("list").innerHTML =
        "<div class='card'><p class='err'>Google blocked the connection from this page.</p>" +
        "<p class='muted'>Use the working panel:</p>" +
        "<p><a class='btn' href='" + APP + "' rel='noreferrer noopener' referrerpolicy='no-referrer' target='_blank'>Open admin</a></p>" +
        "<p class='muted'>" + err + "</p></div>";
    }
    function loadList() {
      setStatus("Loading…");
      jsonp("action=list").then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || "unauthorized");
        setStatus("");
        renderList(data.playlists);
      }).catch(function (err) {
        setStatus("");
        failBox(err.message);
      });
    }
    function openPlaylist(id) {
      setStatus("Loading tracks…");
      jsonp("action=pending&id=" + encodeURIComponent(id)).then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || "fail");
        setStatus("");
        renderTracks(data);
      }).catch(function (err) { setStatus(""); failBox(err.message); });
    }
    function decide(id, row, status) {
      setStatus("Saving…");
      jsonp("action=set&id=" + encodeURIComponent(id) + "&row=" + encodeURIComponent(row) + "&status=" + encodeURIComponent(status))
        .then(function (data) {
          if (!data || !data.ok) throw new Error((data && data.error) || "fail");
          setStatus(status === "approved" ? "Approved" : "Declined", "ok");
          openPlaylist(id);
        }).catch(function (err) { setStatus(""); failBox(err.message); });
    }
    function showApp() {
      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      sessionStorage.setItem("ignite_admin_ok", "1");
      loadList();
    }
    function tryLogin() {
      if ($("loginPass").value.trim() !== PAGE_PASS) {
        $("loginErr").hidden = false;
        $("loginErr").textContent = "Wrong password";
        return;
      }
      showApp();
    }
    $("loginBtn").onclick = tryLogin;
    $("loginPass").addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });
    if (sessionStorage.getItem("ignite_admin_ok") === "1") showApp();
    $("loginPass").focus();
  </script>
</body>
</html>
