<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אדמין — Ignite Records</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    body { max-width: 880px; margin: 0 auto; }
    .admin-head { padding: 1.5rem 1.25rem 0.5rem; }
    .admin-head h1 { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.08em; font-size: 2rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .setup, .card, .track {
      background: var(--bg2); border: 1px solid var(--line);
      border-radius: 10px; padding: 1rem 1.1rem; margin: 0.75rem 1.25rem;
    }
    .plist {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; cursor: pointer; text-align: right;
    }
    .plist:hover { border-color: var(--fire); }
    .count {
      min-width: 2.2rem; height: 2.2rem; border-radius: 999px;
      background: var(--fire); color: var(--bg); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .count.zero { background: #333; color: var(--muted); }
    .track { display: grid; gap: 0.6rem; }
    .track-top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: flex-start; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn.small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .ok { color: #8f8; }
    .err { color: #f88; }
    input[type="password"], input[type="url"] {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      color: var(--text); padding: 0.55rem 0.7rem; border-radius: 8px;
    }
    footer a.admin-link { opacity: 0.35; font-size: 0.75rem; }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Ignite Records home"><img class="logo-nav-img" src="brand/logo-nav.jpg" alt="Ignite Records" /></a>
      <a href="index.html" style="font-size:0.85rem">חזרה לאתר</a>
    </div>
  </nav>

  <div class="admin-head">
    <h1>אדמין</h1>
    <p class="muted">שירים ממתינים לאישור בכל הפלייליסטים</p>
  </div>

  <div class="setup" id="setup">
    <p class="muted" style="margin-bottom:0.7rem">פעם ראשונה: הדבק את כתובת ה־Web App של סקריפט האדמין וסיסמה.</p>
    <div class="form-group"><label>כתובת הסקריפט</label><input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" /></div>
    <div class="form-group" style="margin-top:0.6rem"><label>סיסמה</label><input id="secret" type="password" /></div>
    <button class="btn" style="margin-top:0.8rem" id="saveSetup">שמירה</button>
  </div>

  <p id="status" class="muted" style="padding:0 1.25rem"></p>
  <div id="list"></div>
  <div id="detail" hidden></div>

  <footer>
    <p>© 2026 Ignite Records · <a href="index.html">Home</a> · <a class="admin-link" href="admin.html">אדמין</a></p>
  </footer>

  <script>
    var STORAGE_URL = "ignite_admin_url";
    var STORAGE_SECRET = "ignite_admin_secret";
    var cbN = 0;

    function $(id) { return document.getElementById(id); }
    function scriptUrl() { return localStorage.getItem(STORAGE_URL) || ""; }
    function secret() { return sessionStorage.getItem(STORAGE_SECRET) || localStorage.getItem(STORAGE_SECRET) || ""; }

    function jsonp(params) {
      return new Promise(function (resolve, reject) {
        var name = "igniteAdminCb" + (++cbN);
        var t = setTimeout(function () {
          cleanup();
          reject(new Error("timeout"));
        }, 20000);
        function cleanup() {
          clearTimeout(t);
          delete window[name];
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }
        window[name] = function (data) {
          cleanup();
          resolve(data);
        };
        var url = scriptUrl() + (scriptUrl().indexOf("?") >= 0 ? "&" : "?") + params +
          "&secret=" + encodeURIComponent(secret()) +
          "&callback=" + name + "&_=" + Date.now();
        var s = document.createElement("script");
        s.onerror = function () { cleanup(); reject(new Error("load failed")); };
        s.src = url;
        document.body.appendChild(s);
      });
    }

    function setStatus(text, cls) {
      $("status").className = "muted " + (cls || "");
      $("status").textContent = text || "";
    }

    $("saveSetup").onclick = function () {
      var u = $("scriptUrl").value.trim();
      var s = $("secret").value.trim();
      if (!u || !s) { setStatus("חסרים שדות", "err"); return; }
      localStorage.setItem(STORAGE_URL, u);
      localStorage.setItem(STORAGE_SECRET, s);
      sessionStorage.setItem(STORAGE_SECRET, s);
      loadList();
    };

    function renderList(rows) {
      $("detail").hidden = true;
      var root = $("list");
      root.innerHTML = "";
      (rows || []).forEach(function (p) {
        var el = document.createElement("div");
        el.className = "card plist";
        el.innerHTML = "<div><strong>" + p.title + "</strong><div class='muted'>" + (p.error || p.id) + "</div></div>" +
          "<div class='count" + (p.pending ? "" : " zero") + "'>" + (p.pending || 0) + "</div>";
        el.onclick = function () { openPlaylist(p.id); };
        root.appendChild(el);
      });
    }

    function renderTracks(pack) {
      $("list").innerHTML = "";
      var box = $("detail");
      box.hidden = false;
      var html = "<div class='setup'><button class='btn outline small' id='backBtn'>← כל הפלייליסטים</button></div>";
      html += "<div class='admin-head'><h1>" + pack.title + "</h1><p class='muted'>" + (pack.tracks || []).length + " ממתינים</p></div>";
      (pack.tracks || []).forEach(function (t) {
        var listen = t.listen || (t.trackId ? "https://open.spotify.com/track/" + t.trackId : "");
        html += "<div class='track' data-row='" + t.row + "'>" +
          "<div class='track-top'><div><strong>" + (t.stage || t.name || "ללא שם") + "</strong>" +
          "<div class='muted'>" + (t.email || "") + "</div>" +
          "<div class='muted'>" + (t.trackId || t.url || "") + "</div></div></div>" +
          "<div class='actions'>" +
          (listen ? "<a class='btn outline small' target='_blank' rel='noopener' href='" + listen + "'>האזן</a>" : "") +
          "<button class='btn small approve' data-id='" + pack.id + "' data-row='" + t.row + "'>אשר ✓</button>" +
          "<button class='btn outline small decline' data-id='" + pack.id + "' data-row='" + t.row + "'>דחה</button>" +
          "</div></div>";
      });
      if (!(pack.tracks || []).length) html += "<p class='muted' style='padding:1rem 1.25rem'>אין שירים ממתינים</p>";
      box.innerHTML = html;
      $("backBtn").onclick = loadList;
      box.querySelectorAll(".approve").forEach(function (btn) {
        btn.onclick = function () { decide(btn.getAttribute("data-id"), btn.getAttribute("data-row"), "approved"); };
      });
      box.querySelectorAll(".decline").forEach(function (btn) {
        btn.onclick = function () { decide(btn.getAttribute("data-id"), btn.getAttribute("data-row"), "declined"); };
      });
    }

    function loadList() {
      if (!scriptUrl() || !secret()) {
        $("setup").style.display = "block";
        return;
      }
      $("setup").style.display = "none";
      $("scriptUrl").value = scriptUrl();
      setStatus("טוען…");
      jsonp("action=list").then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || "unauthorized");
        setStatus("");
        renderList(data.playlists);
      }).catch(function (err) {
        $("setup").style.display = "block";
        setStatus("לא מצליח להתחבר: " + err.message, "err");
      });
    }

    function openPlaylist(id) {
      setStatus("טוען שירים…");
      jsonp("action=pending&id=" + encodeURIComponent(id)).then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || "fail");
        setStatus("");
        renderTracks(data);
      }).catch(function (err) {
        setStatus(err.message, "err");
      });
    }

    function decide(id, row, status) {
      setStatus("שומר…");
      jsonp("action=set&id=" + encodeURIComponent(id) + "&row=" + encodeURIComponent(row) + "&status=" + encodeURIComponent(status))
        .then(function (data) {
          if (!data || !data.ok) throw new Error((data && data.error) || "fail");
          setStatus(status === "approved" ? "אושר" : "נדחה", "ok");
          openPlaylist(id);
        }).catch(function (err) {
          setStatus(err.message, "err");
        });
    }

    loadList();
  </script>
</body>
</html>
